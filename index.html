<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دليل Wayground الذكي : ابنِ اختباراتك الإلكترونية بالذكاء الاصطناعي</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    background: #eef1f9;
    color: #1f2937;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 720px;
    height: 100vh;
    height: 100dvh;
    background: #fff;
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 30px rgba(0,0,0,.08);
  }
  header {
    background: linear-gradient(135deg, #0f766e, #2563eb);
    color: #fff;
    padding: 14px 18px;
  }
  header h1 { margin: 0; font-size: 19px; line-height: 1.5; }
  header p { margin: 2px 0 0; font-size: 13px; opacity: .9; }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: #f8f9fd;
  }
  .msg {
    max-width: 94%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.9;
    font-size: 16px;
  }
  .bot  { background: #fff; border: 1px solid #e5e7eb; align-self: flex-start; border-top-right-radius: 4px; }
  .user { background: #0f766e; color: #fff; align-self: flex-end; border-top-left-radius: 4px; }

  .msg .h { font-weight: bold; color: #0f766e; margin: 6px 0 4px; font-size: 16.5px; }
  .msg p { margin: 4px 0; }
  .msg ul, .msg ol { margin: 4px 0; padding-right: 22px; padding-left: 0; }
  .msg li { margin: 4px 0; }
  .msg li ul { list-style: circle; margin: 2px 0; }
  .msg li strong { color: #1d4ed8; }
  .msg img { max-width: 100%; border-radius: 10px; margin: 8px 0; border: 1px solid #e5e7eb; }
  .msg a { color: #1d4ed8; font-weight: bold; }

  .video-box { margin: 10px 0 4px; }
  .video-title { font-size: 14px; color: #6b7280; margin-bottom: 4px; }
  .video-wrap { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 10px; overflow: hidden; }
  .video-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .video-open { display: inline-block; margin-top: 4px; font-size: 14px; }

  .listen-btn {
    display: inline-block; margin: 0 0 8px; padding: 6px 14px;
    font-size: 14px; font-family: inherit;
    background: #ecfdf5; color: #047857;
    border: 1.5px solid #a7f3d0; border-radius: 999px; cursor: pointer;
  }
  .listen-btn.on { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }

  #panel { border-top: 1px solid #e5e7eb; padding: 10px 14px 12px; background: #fff; max-height: 46vh; overflow-y: auto; }
  #panelTitle { font-size: 14px; color: #6b7280; margin: 0 0 8px; }
  .btn {
    display: block; width: 100%; text-align: right; margin-bottom: 8px;
    padding: 12px 14px; font-size: 16px; font-family: inherit;
    background: #f0fdfa; color: #0f766e; border: 1.5px solid #99f6e4;
    border-radius: 10px; cursor: pointer;
  }
  .btn:hover, .btn:active { background: #ccfbf1; }
  .btn.q { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
  .btn.q:hover, .btn.q:active { background: #dbeafe; }
  .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin-top: 2px; }
  .link-btn { background: none; border: none; padding: 4px 0; color: #6b7280; font-family: inherit; font-size: 14px; text-decoration: underline; cursor: pointer; }

  #voiceBox { width: 100%; font-size: 13px; color: #374151; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 10px; padding: 6px 10px; }
  #voiceBox summary { cursor: pointer; color: #047857; font-size: 14px; }
  #voiceBox label { display: block; margin: 8px 0 2px; color: #6b7280; }
  #voiceBox select { width: 100%; font-family: inherit; font-size: 13px; padding: 5px; border: 1px solid #d1d5db; border-radius: 8px; background: #fff; }
  #voiceTip { margin: 8px 0 2px; color: #92400e; background: #fffbeb; border-radius: 8px; padding: 6px 8px; display: none; line-height: 1.7; }

  #gate { position: fixed; inset: 0; background: rgba(31, 41, 55, .88); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 10; }
  #gate .box { background: #fff; border-radius: 16px; padding: 26px 22px; width: 100%; max-width: 380px; text-align: center; }
  #gate h2 { margin: 0 0 6px; font-size: 21px; color: #0f766e; }
  #gate .sub { margin: 0 0 14px; color: #6b7280; font-size: 14px; line-height: 1.6; }
  #gate .ask { margin: 0 0 12px; font-size: 18px; font-weight: bold; }
  #gate input { width: 100%; padding: 12px; font-size: 17px; font-family: inherit; border: 1.5px solid #99f6e4; border-radius: 10px; text-align: center; margin-bottom: 10px; }
  #gate .err { color: #dc2626; font-size: 14px; min-height: 20px; margin-bottom: 8px; }
  #gate button { width: 100%; padding: 12px; font-size: 17px; font-family: inherit; background: #0f766e; color: #fff; border: none; border-radius: 10px; cursor: pointer; }
</style>
</head>

<div id="gate">

  <div id="panel">

        <label for="arSel">الصوت العربي</label>
        <select id="arSel"></select>
        <label for="enSel">الصوت الإنجليزي</label>
        <select id="enSel"></select>
        <label for="rateSel">سرعة القراءة</label>

          <option value="1.05">أسرع</option>

      </details>
    </div>
  </div>

const chat = document.getElementById("chat");
const buttons = document.getElementById("buttons");
const panelTitle = document.getElementById("panelTitle");
const backBtn = document.getElementById("backBtn");
let studentName = "";

document.getElementById("title").textContent = TITLE;
document.title = TITLE;
document.getElementById("gateTitle").textContent = TITLE;

function scrollDown() { chat.scrollTop = chat.scrollHeight; }

function ytId(v) {
  const m = String(v).match(/(?:v=|youtu\.be\/|embed\/|shorts\/)?([\w-]{11})(?:[?&].*)?$/);
  return m ? m[1] : v;
}

function renderList(items, ordered) {
  const list = document.createElement(ordered ? "ol" : "ul");
  items.forEach(function (it) {
    const li = document.createElement("li");
    if (typeof it === "string") {
      li.textContent = it;
    } else {
      const b = document.createElement("strong");
      b.textContent = it.t;
      li.appendChild(b);
      if (it.sub) li.appendChild(renderList(it.sub, false));
    }
    list.appendChild(li);
  });
  return list;
}

function renderBlock(block, parent) {
  if (block.h) {
    const d = document.createElement("div"); d.className = "h"; d.textContent = block.h; parent.appendChild(d);
  }
  if (block.p) {
    const p = document.createElement("p"); p.textContent = block.p; parent.appendChild(p);
  }
  if (block.list) parent.appendChild(renderList(block.list, block.ordered));
  if (block.img) {
    const im = document.createElement("img"); im.src = block.img; im.alt = block.alt || ""; im.loading = "lazy"; parent.appendChild(im);
  }
  if (block.link) {
    const a = document.createElement("a");
    a.href = block.link; a.target = "_blank"; a.rel = "noopener noreferrer";
    a.textContent = "🔗 " + (block.t || block.link);
    const p = document.createElement("p"); p.appendChild(a); parent.appendChild(p);
  }
  if (block.video) {
    const id = ytId(block.video);
    const box = document.createElement("div"); box.className = "video-box";
    if (block.title) {
      const t = document.createElement("div"); t.className = "video-title"; t.textContent = block.title; box.appendChild(t);
    }
    const wrap = document.createElement("div"); wrap.className = "video-wrap";
    const f = document.createElement("iframe");
    f.src = "https://www.youtube-nocookie.com/embed/" + id;
    f.title = block.title || "فيديو";
    f.allowFullscreen = true;
    f.setAttribute("allow", "accelerometer; autoplay; encrypted-media; picture-in-picture; fullscreen");
    f.setAttribute("loading", "lazy");
    wrap.appendChild(f); box.appendChild(wrap);
    const open = document.createElement("a");
    open.className = "video-open"; open.href = "https://www.youtube.com/watch?v=" + id;
    open.target = "_blank"; open.rel = "noopener noreferrer";
    open.textContent = "فتح الفيديو في صفحة جديدة";
    box.appendChild(open);
    parent.appendChild(box);
  }
}

/* ============================================================
   القراءة الصوتية (استمع)
   - النص يُقسَّم إلى مقاطع عربية وإنجليزية، وكل مقطع يُقرأ بصوت لغته
   - يُفضَّل تلقائيًا أجود الأصوات المتاحة على الجهاز (Natural / Online / Neural / Google)
   - إن وُجد تسجيل بشري للإجابة (audio) يُشغَّل بدل صوت المتصفح
   ============================================================ */
const canSpeak = ("speechSynthesis" in window) && ("SpeechSynthesisUtterance" in window);
const synth = canSpeak ? window.speechSynthesis : null;
const AR_KEY = "voiceAr", EN_KEY = "voiceEn", RATE_KEY = "voiceRate";
const arSel = document.getElementById("arSel");
const enSel = document.getElementById("enSel");
const rateSel = document.getElementById("rateSel");
const voiceTip = document.getElementById("voiceTip");

let allVoices = [];
let currentBtn = null;
let currentAudio = null;
let speakToken = 0;
let autoRead = false;

function lsGet(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

function voiceScore(v, lang) {
  const n = v.name || "", l = (v.lang || "").replace("_", "-");
  let s = 0;
  if (lang === "ar") {
    if (!/^ar/i.test(l)) return -1;
    if (/^ar-EG/i.test(l) || /hoda|salma|shakir|egypt|مصر/i.test(n)) s += 15;
    if (/^ar-SA/i.test(l)) s += 6;
  } else {
    if (!/^en/i.test(l)) return -1;
    if (/^en-US/i.test(l)) s += 12;
    else if (/^en-GB/i.test(l)) s += 8;
    if (/aria|jenny|guy|samantha|ava|serena|daniel|google us english/i.test(n)) s += 8;
  }
  if (/natural/i.test(n)) s += 60;
  if (/neural|online/i.test(n)) s += 40;
  if (/google/i.test(n)) s += 20;
  if (/premium|enhanced/i.test(n)) s += 15;
  if (v.localService === false) s += 5;
  if (/espeak|compact/i.test(n)) s -= 30;
  return s;
}

function sortedVoices(lang) {
  return allVoices
    .map(function (v) { return { v: v, s: voiceScore(v, lang) }; })
    .filter(function (x) { return x.s >= 0; })
    .sort(function (a, b) { return b.s - a.s; })
    .map(function (x) { return x.v; });
}

function fillSelect(sel, lang, key) {
  const list = sortedVoices(lang);
  sel.innerHTML = "";
  if (!list.length) {
    const o = document.createElement("option");
    o.textContent = lang === "ar" ? "لا يوجد صوت عربي على هذا الجهاز" : "لا يوجد صوت إنجليزي على هذا الجهاز";
    o.value = ""; sel.appendChild(o);
    return;
  }
  const saved = lsGet(key);
  list.forEach(function (v, i) {
    const o = document.createElement("option");
    o.value = v.name;
    o.textContent = v.name + " (" + v.lang + ")" + (i === 0 ? "  ★ الأفضل" : "");
    sel.appendChild(o);
  });
  if (saved && list.some(function (v) { return v.name === saved; })) sel.value = saved;
}

function populateVoices() {
  if (!canSpeak) return;
  allVoices = synth.getVoices() || [];
  if (!allVoices.length) return;
  fillSelect(arSel, "ar", AR_KEY);
  fillSelect(enSel, "en", EN_KEY);
  const hasAr = sortedVoices("ar").length > 0;
  const arBest = sortedVoices("ar")[0];
  const natural = arBest && /natural|neural|online|google/i.test(arBest.name);
  if (!hasAr) {
    voiceTip.style.display = "block";
    voiceTip.textContent = "جهازك ليس به صوت عربي. لسماع القراءة بصوت عربي واضح افتح الموقع من متصفح Microsoft Edge على الكمبيوتر أو Google Chrome على الموبايل، أو أضف صوتًا عربيًا من إعدادات اللغة في جهازك.";
  } else if (!natural) {
    voiceTip.style.display = "block";
    voiceTip.textContent = "للحصول على أقرب صوت لصوت الإنسان افتح الموقع من متصفح Microsoft Edge (به أصوات عربية وإنجليزية طبيعية مثل Hoda وSalma وAria)، أو Google Chrome.";
  } else {
    voiceTip.style.display = "none";
  }
}
if (canSpeak) {
  populateVoices();
  synth.onvoiceschanged = populateVoices;
  setTimeout(populateVoices, 500);
  setTimeout(populateVoices, 1500);
  const r = lsGet(RATE_KEY); if (r) rateSel.value = r;
}
arSel.onchange = function () { lsSet(AR_KEY, arSel.value); };
enSel.onchange = function () { lsSet(EN_KEY, enSel.value); };
rateSel.onchange = function () { lsSet(RATE_KEY, rateSel.value); };

function getVoice(lang) {
  const sel = lang === "ar" ? arSel : enSel;
  const list = sortedVoices(lang);
  if (sel.value) {
    const m = list.filter(function (v) { return v.name === sel.value; })[0];
    if (m) return m;
  }
  return list[0] || null;
}

/* ---- تجهيز النص للقراءة ---- */
function addStop(t) { return /[.!؟?:؛]$/.test(t) ? t : t + "."; }

function listToText(items) {
  const out = [];
  items.forEach(function (it) {
    if (typeof it === "string") out.push(addStop(it));
    else {
      out.push(addStop(it.t));
      if (it.sub) out.push(listToText(it.sub));
    }
  });
  return out.join(" ");
}

function blocksToText(blocks) {
  const out = [];
  blocks.forEach(function (b) {
    if (b.h) out.push(addStop(b.h));
    if (b.p) out.push(addStop(b.p));
    if (b.list) out.push(listToText(b.list));
  });
  return out.join(" ");
}

// أسماء ومصطلحات إنجليزية لها نطق خاص
const EN_FIX = [
  [/wayground\.com\/join/gi, "way ground dot com slash join"],
  [/wayground\.com/gi, "way ground dot com"],
  [/Wayground/gi, "Way ground"],
  [/Quizizz/gi, "Quiz iz"],
  [/Gmail/gi, "G mail"],
  [/PDF/g, "P D F"],
  [/\bURL\b/g, "U R L"],
  [/\bAI\b/g, "A I"],
  [/\bUI\b/g, "U I"],
  [/\bQ&A\b/g, "Q and A"]
];

function cleanForSpeech(text) {
  let t = String(text);
  t = t.replace(/[ً-ٰٟـ]/g, "");                 // التشكيل والتطويل
  t = t.replace(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}⬅➡★]/gu, " "); // الإيموجي
  t = t.replace(/https?:\/\/\S+/g, " ");
  EN_FIX.forEach(function (p) { t = t.replace(p[0], p[1]); });
  t = t.replace(/\(([^()]*[A-Za-z][^()]*)\)/g, ", $1, ");           // (English) -> , English,
  t = t.replace(/[()\[\]{}"«»*_#~|<>]/g, " ");
  t = t.replace(/\s*[\/\\]\s*/g, " ");
  t = t.replace(/\s*[-–—]\s+/g, ", ");
  t = t.replace(/\s+/g, " ").trim();
  return t;
}

// تقسيم إلى جمل قصيرة (لتفادي توقف Chrome في الجمل الطويلة)
function splitSentences(text) {
  const parts = text.split(/(?<=[.!؟?؛:،,])\s+/);
  const out = [];
  parts.forEach(function (p) {
    p = p.trim();
    while (p.length > 170) {
      let cut = p.lastIndexOf(" ", 160);
      if (cut < 60) cut = 160;
      out.push(p.slice(0, cut).trim());
      p = p.slice(cut).trim();
    }
    if (p) out.push(p);
  });
  return out;
}

// تقسيم الجملة إلى مقاطع حسب اللغة (عربي / إنجليزي)
function splitByLang(sentence) {
  const runs = [];
  const re = /[A-Za-z][A-Za-z0-9'’.\-]*(?:\s+[A-Za-z][A-Za-z0-9'’.\-]*)*|[^A-Za-z]+/g;
  let m;
  while ((m = re.exec(sentence)) !== null) {
    const s = m[0];
    const isEn = /^[A-Za-z]/.test(s);
    const clean = s.replace(/^[\s,.\-]+|[\s,\-]+$/g, "");
    if (!clean || !/[A-Za-z؀-ۿ0-9]/.test(clean)) continue;
    runs.push({ lang: isEn ? "en" : "ar", text: isEn ? clean.replace(/\.+$/, "") : clean });
  }
  return runs;
}

function buildQueue(text) {
  const q = [];
  splitSentences(cleanForSpeech(text)).forEach(function (sent) {
    splitByLang(sent).forEach(function (r) { q.push(r); });
  });
  return q;
}

/* ---- التشغيل ---- */
function resetListenBtn() {
  if (currentBtn) { currentBtn.classList.remove("on"); currentBtn.textContent = "🔊 استمع"; currentBtn = null; }
}

function stopSpeech() {
  speakToken++;
  if (canSpeak) synth.cancel();
  if (currentAudio) { try { currentAudio.pause(); } catch (e) {} currentAudio = null; }
  resetListenBtn();
}

function speakQueue(queue, btn) {
  const token = ++speakToken;
  const rate = parseFloat(rateSel.value) || 0.92;
  let i = 0;
  function next() {
    if (token !== speakToken) return;
    if (i >= queue.length) { if (currentBtn === btn) resetListenBtn(); return; }
    const item = queue[i++];
    const u = new SpeechSynthesisUtterance(item.text);
    const v = getVoice(item.lang);
    if (v) { u.voice = v; u.lang = v.lang; }
    else u.lang = item.lang === "ar" ? "ar-EG" : "en-US";
    u.rate = rate; u.pitch = 1; u.volume = 1;
    let done = false;
    function fin() { if (done) return; done = true; clearTimeout(guard); setTimeout(next, 60); }
    // حماية: لو لم يُطلق المتصفح حدث الانتهاء
    const guard = setTimeout(fin, Math.max(4000, item.text.length * 140 / rate));
    u.onend = fin;
    u.onerror = function (e) { if (e && (e.error === "canceled" || e.error === "interrupted")) { done = true; clearTimeout(guard); return; } fin(); };
    synth.speak(u);
  }
  synth.cancel();
  setTimeout(next, 80);
}

function toggleSpeak(text, btn, audioSrc) {
  if (currentBtn === btn) { stopSpeech(); return; }
  stopSpeech();
  currentBtn = btn;
  btn.classList.add("on");
  btn.textContent = "⏹ إيقاف";

  if (audioSrc) {
    currentAudio = new Audio(audioSrc);
    currentAudio.onended = function () { if (currentBtn === btn) resetListenBtn(); };
    currentAudio.onerror = function () {
      currentAudio = null;
      if (canSpeak) speakQueue(buildQueue(text), btn); else resetListenBtn();
    };
    currentAudio.play().catch(function () {
      currentAudio = null;
      if (canSpeak) speakQueue(buildQueue(text), btn); else resetListenBtn();
    });
    return;
  }
  speakQueue(buildQueue(text), btn);
}

window.addEventListener("beforeunload", function () { if (canSpeak) synth.cancel(); });

function addMessage(content, who, autoSpeak, audioSrc) {
  const div = document.createElement("div");
  div.className = "msg " + who;
  let speech = "";
  if (typeof content === "string") {
    div.textContent = content;
    div.style.whiteSpace = "pre-wrap";
    speech = content;
  } else {
    content.forEach(function (b) { renderBlock(b, div); });
    speech = blocksToText(content);
  }
  if (who === "bot" && (canSpeak || audioSrc)) {
    const lb = document.createElement("button");
    lb.className = "listen-btn";
    lb.textContent = "🔊 استمع";
    lb.onclick = function () { toggleSpeak(speech, lb, audioSrc); };
    div.insertBefore(lb, div.firstChild);
    if (autoSpeak && autoRead) toggleSpeak(speech, lb, audioSrc);
  }
  chat.appendChild(div);
  scrollDown();
  return div;
}

function clearButtons() { buttons.innerHTML = ""; }

function showSections() {
  clearButtons();
  panelTitle.textContent = "اختر القسم:";
  backBtn.style.display = "none";
  SECTIONS.forEach(function (s) {
    const b = document.createElement("button");
    b.className = "btn";
    b.textContent = s.icon + "  " + s.title;
    b.onclick = function () {
      addMessage(s.icon + " " + s.title, "user");
      setTimeout(function () {
        addMessage("تمام! اختر السؤال اللي عايز تعرف إجابته 👇", "bot");
        showQuestions(s);
      }, 250);
    };
    buttons.appendChild(b);
  });
  panel_scroll();
}

function showQuestions(section) {
  clearButtons();
  panelTitle.textContent = section.icon + " " + section.title;
  backBtn.style.display = "inline";
  section.questions.forEach(function (item) {
    const b = document.createElement("button");
    b.className = "btn q";
    b.textContent = item.q;
    b.onclick = function () {
      addMessage(item.q, "user");
      setTimeout(function () { addMessage(item.a, "bot", true, item.audio); }, 300);
    };
    buttons.appendChild(b);
  });
  panel_scroll();
}

function panel_scroll() { document.getElementById("panel").scrollTop = 0; }

function showWelcome() {
  stopSpeech();
  chat.innerHTML = "";
  addMessage((studentName ? "أهلًا يا " + studentName + " 👋\n" : "أهلًا بك 👋\n") + WELCOME, "bot");
  showSections();
}

function sendName(name) {
  if (!SCRIPT_URL) return;
  try {
    fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", body: new URLSearchParams({ name: name }) });
  } catch (e) {}
}

function startApp() {
  if (!ASK_NAME) { showWelcome(); return; }
  let saved = lsGet("studentName_wayground");
  if (saved) { studentName = saved; showWelcome(); return; }

  const gate = document.getElementById("gate");
  const input = document.getElementById("nameInput");
  const err = document.getElementById("nameErr");
  gate.style.display = "flex";

  function submit() {
    const n = input.value.trim().replace(/\s+/g, " ");
    if (n.split(" ").length < 3) { err.textContent = "من فضلك اكتب الاسم الثلاثي (ثلاث كلمات)"; return; }
    studentName = n;
    lsSet("studentName_wayground", n);
    sendName(n);
    gate.style.display = "none";
    showWelcome();
  }
  document.getElementById("nameBtn").onclick = submit;
  input.onkeydown = function (ev) { if (ev.key === "Enter") submit(); };
  input.focus();
}

backBtn.onclick = function () { showSections(); };
document.getElementById("resetBtn").onclick = showWelcome;

const autoBtn = document.getElementById("autoBtn");
if (!canSpeak) { autoBtn.style.display = "none"; document.getElementById("voiceBox").style.display = "none"; }
autoBtn.onclick = function () {
  autoRead = !autoRead;
  autoBtn.textContent = autoRead ? "🔊 القراءة التلقائية: مفعّلة" : "🔈 القراءة التلقائية: متوقفة";
  if (!autoRead) stopSpeech();
};
startApp();
